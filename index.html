<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Inventory Tracker</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    #info {
      position: absolute; top: 15px; width: 90%; left: 5%; 
      text-align: center; color: white; background: rgba(0,0,0,0.6); 
      padding: 12px; border-radius: 8px; z-index: 100; font-size: 14px;
      backdrop-filter: blur(4px); pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="info">กำลังตรวจสอบระบบแวดล้อม...</div>

  <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "troika-three-text": "https://esm.sh/troika-three-text@0.49.0?external=three"
      }
    }
  </script>

  <script type="module">
    // ดักดูว่าโค้ดบรรทัดแรกทำงานหรือไม่
    document.getElementById('info').innerText = 'กำลังโหลด 3D Engine...';

    import * as THREE from 'three';
    import { ARButton } from 'three/addons/webxr/ARButton.js';
    import { Text } from 'troika-three-text';

    const API_URL = 'https://script.google.com/macros/s/AKfycbx-ngkZuLKZyM-ccuab3ku5498J1CFQwkKku7oZC8eRmD3e9Dr2LjU85o5_cMqdPgxyQA/exec'; 

    let camera, scene, renderer;
    let controller, reticle;
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    let originGroup = null; 
    let inventoryData = [];
    let isOriginSet = false;

    // ตรวจสอบเบราว์เซอร์
    if (!('xr' in navigator)) {
      document.getElementById('info').innerText = 'อุปกรณ์/เบราว์เซอร์นี้ ไม่รองรับ AR';
    } else {
      init();
    }

    async function fetchInventory() {
      try {
        document.getElementById('info').innerText = 'กำลังเชื่อมต่อฐานข้อมูล Google Sheets...';
        const response = await fetch(API_URL);
        
        if (!response.ok) throw new Error('Network error');
        
        const json = await response.json();
        
        if(json.status === 'success') {
          inventoryData = json.data;
          document.getElementById('info').innerText = 'เล็งกล้องที่มุมชั้นวาง แล้วแตะหน้าจอเพื่อวางพิกัด (0,0,0)';
        } else {
           document.getElementById('info').innerText = 'ข้อมูลผิดพลาด: ' + (json.message || 'ไม่ทราบสาเหตุ');
        }
      } catch(e) {
        document.getElementById('info').innerText = 'โหลดข้อมูลล้มเหลว ตรวจสอบ URL หรือสิทธิ์ API';
      }
    }

    function init() {
      try {
        const container = document.createElement('div');
        document.body.appendChild(container);

        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
        
        const light = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(light);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        container.appendChild(renderer.domElement);

        document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] }));

        fetchInventory();

        const reticleGeometry = new THREE.RingGeometry(0.05, 0.06, 32).rotateX(-Math.PI / 2);
        const reticleMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
        reticle = new THREE.Mesh(reticleGeometry, reticleMaterial);
        reticle.matrixAutoUpdate = false;
        reticle.visible = false;
        scene.add(reticle);

        controller = renderer.xr.getController(0);
        controller.addEventListener('select', onSelect);
        scene.add(controller);

        window.addEventListener('resize', onWindowResize);
        renderer.setAnimationLoop(render);
      } catch (error) {
         document.getElementById('info').innerText = 'เกิดข้อผิดพลาดในการสร้างฉาก 3D';
      }
    }

    function onSelect() {
      if (!isOriginSet) {
        if (reticle.visible) setOriginAndSpawnItems();
      } else {
        checkIntersection();
      }
    }

    function setOriginAndSpawnItems() {
      originGroup = new THREE.Group();
      originGroup.position.setFromMatrixPosition(reticle.matrix);
      originGroup.quaternion.setFromRotationMatrix(reticle.matrix); 
      scene.add(originGroup);
      
      isOriginSet = true;
      reticle.visible = false; 
      document.getElementById('info').innerText = 'แตะที่ป้ายสินค้าเพื่อ Check-in';

      inventoryData.forEach(item => {
        const textMesh = new Text();
        textMesh.text = `${item.ItemID}\n${item.Color}`;
        textMesh.fontSize = 0.04; 
        textMesh.color = item.Status === 'Checked' ? 0x00ff00 : 0xffffff; 
        textMesh.anchorX = 'center';
        textMesh.anchorY = 'middle';
        
        const posX = parseFloat(item.X) || 0;
        const posY = parseFloat(item.Y) || 0;
        const posZ = parseFloat(item.Z) || 0;
        textMesh.position.set(posX, posY, posZ);

        textMesh.rotation.x = -Math.PI / 2;
        textMesh.userData = { id: item.ItemID, status: item.Status };
        textMesh.sync();
        originGroup.add(textMesh);
      });
    }

    function checkIntersection() {
      const tempMatrix = new THREE.Matrix4();
      tempMatrix.identity().extractRotation(controller.matrixWorld);
      const raycaster = new THREE.Raycaster();
      raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
      raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

      const intersects = raycaster.intersectObjects(originGroup.children, true);
      if (intersects.length > 0) {
        const hitObject = intersects[0].object;
        const textObj = hitObject.isText ? hitObject : hitObject.parent;
        
        if (textObj && textObj.userData.id && textObj.userData.status !== 'Checked') {
          updateStatus(textObj);
        }
      }
    }

    async function updateStatus(textMesh) {
      textMesh.color = 0xffff00; 
      textMesh.sync();
      document.getElementById('info').innerText = `กำลังอัปเดต ${textMesh.userData.id}...`;

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ ItemID: textMesh.userData.id })
        });
        const result = await response.json();
        
        if (result.status === 'success') {
          textMesh.color = 0x00ff00; 
          textMesh.userData.status = 'Checked';
          document.getElementById('info').innerText = `บันทึก ${textMesh.userData.id} สำเร็จ!`;
        } else {
          throw new Error(result.message);
        }
      } catch (e) {
        textMesh.color = 0xff0000; 
        document.getElementById('info').innerText = `อัปเดตผิดพลาด: ${e.message}`;
      }
      textMesh.sync();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function render(timestamp, frame) {
      if (frame && !isOriginSet) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const session = renderer.xr.getSession();

        if (!hitTestSourceRequested) {
          session.requestReferenceSpace('viewer').then((viewerSpace) => {
            session.requestHitTestSource({ space: viewerSpace }).then((source) => {
              hitTestSource = source;
            });
          });
          session.addEventListener('end', () => {
            hitTestSourceRequested = false;
            hitTestSource = null;
          });
          hitTestSourceRequested = true;
        }

        if (hitTestSource) {
          const hitTestResults = frame.getHitTestResults(hitTestSource);
          if (hitTestResults.length > 0) {
            const hit = hitTestResults[0];
            const pose = hit.getPose(referenceSpace);
            reticle.visible = true;
            reticle.matrix.fromArray(pose.transform.matrix);
          } else {
            reticle.visible = false;
          }
        }
      }
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
