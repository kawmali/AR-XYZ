<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Inventory Tracker</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    #info {
      position: absolute; top: 15px; width: 90%; left: 5%; 
      text-align: center; color: white; background: rgba(0,0,0,0.6); 
      padding: 12px; border-radius: 8px; z-index: 100; font-size: 14px;
      backdrop-filter: blur(4px); pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="info">กำลังเตรียมระบบ AR...</div>

  <!-- นำเข้าไลบรารี 3D ผ่าน Import Map -->
  <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "troika-three-text": "https://unpkg.com/troika-three-text@0.49.0/dist/troika-three-text.esm.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { ARButton } from 'three/addons/webxr/ARButton.js';
    import { Text } from 'troika-three-text';

    // 🔴 วาง URL จาก Google Apps Script (Deploy > Web App) ของคุณที่นี่
    const API_URL = 'https://script.google.com/macros/s/AKfycbz0jF0WlmSB-f6KXMcOBQwHzOgXPOF11nFbh4EcPCxpg9d0An2Hg7547nTl90TjpsH-eA/exec'; 

    let camera, scene, renderer;
    let controller, reticle;
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    
    let originGroup = null; 
    let inventoryData = [];
    let isOriginSet = false;

    init();

    // 1. ดึงข้อมูลจาก API
    async function fetchInventory() {
      try {
        document.getElementById('info').innerText = 'กำลังโหลดข้อมูลจากฐานข้อมูล...';
        const response = await fetch(API_URL);
        const json = await response.json();
        
        if(json.status === 'success') {
          inventoryData = json.data;
          document.getElementById('info').innerText = 'เล็งกล้องไปที่มุมชั้นวางเป้าหมาย แล้วแตะหน้าจอเพื่อวางพิกัด (0,0,0)';
        }
      } catch(e) {
        document.getElementById('info').innerText = 'โหลดข้อมูลล้มเหลว ตรวจสอบการเชื่อมต่ออินเทอร์เน็ต';
        console.error(e);
      }
    }

    function init() {
      const container = document.createElement('div');
      document.body.appendChild(container);

      // สร้าง Scene และ Camera
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
      
      const light = new THREE.AmbientLight(0xffffff, 1.5);
      scene.add(light);

      // สร้าง Renderer รองรับ WebXR
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      container.appendChild(renderer.domElement);

      // สร้างปุ่ม "Enter AR" (บังคับเปิดโหมด Hit-Test สำหรับหาพื้น)
      document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] }));

      fetchInventory();

      // สร้างเป้าเล็งสีเขียว (Reticle) สำหรับหาจุดที่จะวาง (0,0,0)
      const reticleGeometry = new THREE.RingGeometry(0.05, 0.06, 32).rotateX(-Math.PI / 2);
      const reticleMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
      reticle = new THREE.Mesh(reticleGeometry, reticleMaterial);
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      // การรับ Event เวลานิ้วแตะหน้าจอ
      controller = renderer.xr.getController(0);
      controller.addEventListener('select', onSelect);
      scene.add(controller);

      window.addEventListener('resize', onWindowResize);
      renderer.setAnimationLoop(render);
    }

    // 2. ลอจิกการแตะหน้าจอ
    function onSelect() {
      if (!isOriginSet) {
        // หากยังไม่ได้วาง Origin และเล็งพื้นเจอ ให้สร้างโมเดล 3D
        if (reticle.visible) {
          setOriginAndSpawnItems();
        }
      } else {
        // หากวาง Origin แล้ว การแตะคือการคลิกที่ป้าย 3D (Raycast)
        checkIntersection();
      }
    }

    // 3. วาง 3D Text ตามพิกัดอ้างอิงจากเป้าเล็ง
    function setOriginAndSpawnItems() {
      originGroup = new THREE.Group();
      originGroup.position.setFromMatrixPosition(reticle.matrix);
      // ทำให้ตัวหนังสือหันหน้าตามแกนของพื้น
      originGroup.quaternion.setFromRotationMatrix(reticle.matrix); 
      scene.add(originGroup);
      
      isOriginSet = true;
      reticle.visible = false; 
      document.getElementById('info').innerText = 'แตะที่ป้ายสินค้าเพื่อ Check-in';

      inventoryData.forEach(item => {
        const textMesh = new Text();
        textMesh.text = `${item.ItemID}\n${item.Color}`;
        textMesh.fontSize = 0.04; // ขนาดตัวอักษร
        textMesh.color = item.Status === 'Checked' ? 0x00ff00 : 0xffffff; // สีเขียวถ้าเช็กแล้ว นอกนั้นสีขาว
        textMesh.anchorX = 'center';
        textMesh.anchorY = 'middle';
        
        // จัดพิกัดให้อยู่ตาม Google Sheets
        const posX = parseFloat(item.X) || 0;
        const posY = parseFloat(item.Y) || 0;
        const posZ = parseFloat(item.Z) || 0;
        textMesh.position.set(posX, posY, posZ);

        // หมุนตัวอักษรให้ตั้งขึ้นเผชิญหน้ากับผู้ใช้ (เพราะแกนของพื้นมันนอนราบอยู่)
        textMesh.rotation.x = -Math.PI / 2;

        textMesh.userData = { id: item.ItemID, status: item.Status };
        textMesh.sync();
        originGroup.add(textMesh);
      });
    }

    // 4. การยิง Raycast เพื่อดูว่านิ้วแตะโดนตัวอักษรไหน
    function checkIntersection() {
      const tempMatrix = new THREE.Matrix4();
      tempMatrix.identity().extractRotation(controller.matrixWorld);
      const raycaster = new THREE.Raycaster();
      raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
      raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

      // ตรวจสอบการชนกับ object ลูกๆ ใน originGroup
      const intersects = raycaster.intersectObjects(originGroup.children, true);
      if (intersects.length > 0) {
        const hitObject = intersects[0].object;
        const textObj = hitObject.isText ? hitObject : hitObject.parent;
        
        // ถ้าสินค้านั้นยังไม่ได้ถูกเช็ก ให้ส่ง API
        if (textObj && textObj.userData.id && textObj.userData.status !== 'Checked') {
          updateStatus(textObj);
        }
      }
    }

    // 5. ส่ง POST กลับไปอัปเดตสถานะที่ Google Sheets
    async function updateStatus(textMesh) {
      textMesh.color = 0xffff00; // เปลี่ยนสีเป็นเหลืองระหว่างโหลด
      textMesh.sync();
      document.getElementById('info').innerText = `กำลังอัปเดต ${textMesh.userData.id}...`;

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ ItemID: textMesh.userData.id })
        });
        const result = await response.json();
        
        if (result.status === 'success') {
          textMesh.color = 0x00ff00; // เปลี่ยนสีเป็นเขียวเมื่อสำเร็จ
          textMesh.userData.status = 'Checked';
          document.getElementById('info').innerText = `บันทึก ${textMesh.userData.id} สำเร็จ!`;
        } else {
          throw new Error(result.message);
        }
      } catch (e) {
        textMesh.color = 0xff0000; // สีแดงเมื่อล้มเหลว
        document.getElementById('info').innerText = `อัปเดตผิดพลาด: ${e.message}`;
      }
      textMesh.sync();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // 6. ลูปการเรนเดอร์ภาพ และประมวลผลพื้น (Hit Test)
    function render(timestamp, frame) {
      if (frame && !isOriginSet) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const session = renderer.xr.getSession();

        if (!hitTestSourceRequested) {
          session.requestReferenceSpace('viewer').then((viewerSpace) => {
            session.requestHitTestSource({ space: viewerSpace }).then((source) => {
              hitTestSource = source;
            });
          });
          session.addEventListener('end', () => {
            hitTestSourceRequested = false;
            hitTestSource = null;
          });
          hitTestSourceRequested = true;
        }

        if (hitTestSource) {
          const hitTestResults = frame.getHitTestResults(hitTestSource);
          if (hitTestResults.length > 0) {
            const hit = hitTestResults[0];
            const pose = hit.getPose(referenceSpace);
            reticle.visible = true;
            // ล็อกเป้าเล็งติดกับระนาบพื้น
            reticle.matrix.fromArray(pose.transform.matrix);
          } else {
            reticle.visible = false;
          }
        }
      }
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
