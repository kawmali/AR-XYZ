<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Inventory Tracker</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    #info {
      position: absolute; top: 15px; width: 90%; left: 5%; 
      text-align: center; color: white; background: rgba(0,0,0,0.6); 
      padding: 12px; border-radius: 8px; z-index: 100; font-size: 14px;
      backdrop-filter: blur(4px); pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="info">กำลังเตรียมระบบ AR...</div>

  <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "troika-three-text": "https://esm.sh/troika-three-text@0.49.0?external=three"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { ARButton } from 'three/addons/webxr/ARButton.js';
    import { Text } from 'troika-three-text';

    const API_URL = 'https://script.google.com/macros/s/AKfycbx-ngkZuLKZyM-ccuab3ku5498J1CFQwkKku7oZC8eRmD3e9Dr2LjU85o5_cMqdPgxyQA/exec'; 

    let camera, scene, renderer;
    let controller;
    let originGroup = null; 
    let inventoryData = [];
    let isOriginSet = false;

    init();

    async function fetchInventory() {
      try {
        document.getElementById('info').innerText = 'กำลังเชื่อมต่อฐานข้อมูล Google Sheets...';
        const response = await fetch(API_URL);
        const json = await response.json();
        
        if(json.status === 'success') {
          inventoryData = json.data;
          document.getElementById('info').innerText = 'พร้อมเข้าสู่ AR (กดปุ่ม START AR ด้านล่าง)';
        } else {
          document.getElementById('info').innerText = 'ข้อมูลผิดพลาด: ' + json.message;
        }
      } catch(e) {
        document.getElementById('info').innerText = 'โหลดข้อมูลล้มเหลว ตรวจสอบ URL API';
      }
    }

    function init() {
      const container = document.createElement('div');
      document.body.appendChild(container);

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
      
      const light = new THREE.AmbientLight(0xffffff, 1.5);
      scene.add(light);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      container.appendChild(renderer.domElement);

      // 🔓 ปลดล็อก: ใช้แค่ immersive-ar อย่างเดียว ปุ่มจะกดได้ 100% บนทุกมือถือ
      document.body.appendChild(ARButton.createButton(renderer, { 
        requiredFeatures: ['immersive-ar'] 
      }));

      fetchInventory();

      controller = renderer.xr.getController(0);
      controller.addEventListener('select', onSelect);
      scene.add(controller);

      window.addEventListener('resize', onWindowResize);
      renderer.setAnimationLoop(render);
    }

    // เมื่อกดเข้า AR แล้ว แตะหน้าจอ 1 ครั้งเพื่อวางจุด (0,0,0) ตรงหน้ากล้องทันที
    function onSelect() {
      if (!isOriginSet) {
        spawnOriginAndItems();
      } else {
        checkIntersection();
      }
    }

    function spawnOriginAndItems() {
      originGroup = new THREE.Group();
      
      // วางจุด Origin ไว้ตรงหน้ากล้อง (ห่างออกไป 1 เมตร ระดับพื้นต่ำลงเล็กน้อย)
      const cameraPosition = new THREE.Vector3();
      const cameraQuaternion = new THREE.Quaternion();
      camera.getWorldPosition(cameraPosition);
      camera.getWorldQuaternion(cameraQuaternion);

      originGroup.position.copy(cameraPosition);
      // ให้พิกัดอยู่ต่ำกว่าระดับสายตาเล็กน้อย (ประมาณหน้าชั้นวาง)
      originGroup.position.y -= 0.5; 
      scene.add(originGroup);
      
      isOriginSet = true;
      document.getElementById('info').innerText = 'วางพิกัดสำเร็จ! แตะที่ป้ายเพื่อ Check-in';

      inventoryData.forEach(item => {
        const textMesh = new Text();
        textMesh.text = `${item.ItemID}\n${item.Color}`;
        textMesh.fontSize = 0.04; 
        textMesh.color = item.Status === 'Checked' ? 0x00ff00 : 0xffffff; 
        textMesh.anchorX = 'center';
        textMesh.anchorY = 'middle';
        
        const posX = parseFloat(item.X) || 0;
        const posY = parseFloat(item.Y) || 0;
        const posZ = parseFloat(item.Z) || 0;
        textMesh.position.set(posX, posY, posZ);

        textMesh.userData = { id: item.ItemID, status: item.Status };
        textMesh.sync();
        originGroup.add(textMesh);
      });
    }

    function checkIntersection() {
      const tempMatrix = new THREE.Matrix4();
      tempMatrix.identity().extractRotation(controller.matrixWorld);
      const raycaster = new THREE.Raycaster();
      raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
      raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

      const intersects = raycaster.intersectObjects(originGroup.children, true);
      if (intersects.length > 0) {
        const hitObject = intersects[0].object;
        const textObj = hitObject.isText ? hitObject : hitObject.parent;
        
        if (textObj && textObj.userData.id && textObj.userData.status !== 'Checked') {
          updateStatus(textObj);
        }
      }
    }

    async function updateStatus(textMesh) {
      textMesh.color = 0xffff00; 
      textMesh.sync();
      document.getElementById('info').innerText = `กำลังอัปเดต ${textMesh.userData.id}...`;

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ ItemID: textMesh.userData.id })
        });
        const result = await response.json();
        
        if (result.status === 'success') {
          textMesh.color = 0x00ff00; 
          textMesh.userData.status = 'Checked';
          document.getElementById('info').innerText = `บันทึก ${textMesh.userData.id} สำเร็จ!`;
        } else {
          throw new Error(result.message);
        }
      } catch (e) {
        textMesh.color = 0xff0000; 
        document.getElementById('info').innerText = `อัปเดตผิดพลาด: ${e.message}`;
      }
      textMesh.sync();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function render(timestamp, frame) {
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
